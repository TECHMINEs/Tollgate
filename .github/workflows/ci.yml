name: Tollgate CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: tollgate
          POSTGRES_USER: tollgate
          POSTGRES_PASSWORD: tollgate_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tollgate" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet and format
        run: |
          go vet ./...
          test -z "$(gofmt -l .)"
      - name: Unit tests (race detector)
        run: go test -race ./...
      - name: Create login roles
        env:
          PGPASSWORD: tollgate_dev
        run: psql -h localhost -U tollgate -d tollgate -v ON_ERROR_STOP=1 -f deploy/postgres/10-roles.sql
      - name: Integration tests (row-level security, ledger, outbox)
        env:
          TOLLGATE_TEST_ADMIN_URL: postgres://tollgate:tollgate_dev@localhost:5432/tollgate
        run: go test -count=1 -v ./internal/store/...
      - name: WebAssembly build
        run: GOOS=js GOARCH=wasm go build -o /dev/null ./cmd/tollgate-wasm

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
